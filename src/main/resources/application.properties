spring.application.name=film-puanlama

# Veritabani baglantisi (sifre ortam degiskeninden okunur)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/film_puanlama_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate tablolari otomatik olusturur/gunceller
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# schema.sql (PostgreSQL fonksiyonlari + trigger) tablolar olustuktan sonra calisir.
# Dosyada $$ blogu kullanildigi icin ifadeler ^^^ ile ayrilir.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.separator=^^^

# Izin verilen arayuz adresleri (virgulle ayrilir)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Hata cevaplarinda mesaj gorunsun (arayuz kullaniciya gosterir)
spring.web.error.include-message=always

# JWT: uretimde mutlaka JWT_SECRET (en az 32 karakter) tanimlayin
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=24
